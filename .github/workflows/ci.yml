# ============================================================================
# PIPELINE DE INTEGRACIÓN CONTINUA: PERFORMANCE QUALITY GATE CON GRAFANA K6
# ============================================================================
# Este pipeline actúa como barrera de calidad de rendimiento (Quality Gate)
# en la arquitectura de microservicios:
#  - Se dispara al realizar Push a 'main' o Pull Requests dirigidos a 'main' (desde 'develop').
#  - Levanta la API en el runner efímero de GitHub Actions.
#  - Ejecuta la suite de carga de Grafana k6 verificando que los SLAs se cumplan.
#  - Bloquea la fusión del PR si la latencia p(95) supera 500ms o hay >1% de errores.
#  - Publica los reportes HTML (benc-uk y Dashboard nativo) como artefactos descargables.
# ============================================================================

name: Performance Quality Gate (Grafana k6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ejecutar_estres:
        description: '¿Ejecutar también prueba de estrés extremo (Breaking Point hasta 200 VUs)?'
        type: boolean
        default: false

jobs:
  performance-gate:
    name: K6 Performance & SLA Gate
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      # 2. Configurar entorno de Node.js v20
      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalación limpia de dependencias
      - name: Instalar dependencias de la API
        run: npm ci

      # 4. Levantar la API en segundo plano y esperar a que responda el Healthcheck
      - name: Iniciar API del Microservicio y esperar disponibilidad
        run: |
          nohup npm start > api-server.log 2>&1 &
          echo "Esperando que el microservicio esté listo en http://localhost:3000/api/health..."
          curl --retry 10 --retry-delay 2 --retry-connrefused -s -f http://localhost:3000/api/health || {
            echo "❌ La API no respondió a tiempo. Logs del servidor:"
            cat api-server.log
            exit 1
          }
          echo "✅ API lista y respondiendo 200 OK."

      # 5. Instalar Grafana k6 en el runner de Ubuntu
      - name: Instalar Grafana k6
        uses: grafana/setup-k6-action@v1

      # 6. Ejecutar Smoke Test (Filtro temprano / Fail-Fast)
      - name: Paso 1 - Smoke Test (Filtro temprano de disponibilidad)
        run: |
          k6 run tests/workshop/01-smoke-test.js

      # 7. Ejecutar la prueba de carga con SLAs y generación dual de reportes
      - name: Paso 2 - Prueba de Carga con SLAs (Quality Gate)
        run: |
          K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_EXPORT=dashboard-ci.html k6 run -e CI_QUICK=true tests/workshop/02-load-test-sla.js

      # 8. Ejecutar Prueba de Estrés (Solo cuando se activa manualmente vía workflow_dispatch)
      - name: Paso 3 (Demostración) - Prueba de Estrés y Punto de Ruptura
        if: ${{ github.event.inputs.ejecutar_estres == 'true' }}
        continue-on-error: true # Permite conservar los artefactos aunque la prueba alcance el punto de saturación
        run: |
          k6 run -e CI_QUICK=true tests/workshop/03-stress-breaking-point.js

      # 9. Subir reportes como artefactos de GitHub (siempre se ejecuta)
      - name: Publicar Reportes HTML como Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-reports
          path: |
            reporte-smoke.html
            reporte-load-sla.html
            reporte-stress.html
            dashboard-ci.html
            api-server.log
          retention-days: 14
